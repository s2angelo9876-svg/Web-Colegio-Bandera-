name: colegio-php

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app-environment: &app-environment
  COLEGIO_ENV: production
  COLEGIO_PUBLIC_ORIGIN: "https://${COLEGIO_DOMAIN:?Configura COLEGIO_DOMAIN}"
  COLEGIO_DSN: "pgsql:host=/var/run/postgresql;dbname=colegio_php;connect_timeout=3"
  COLEGIO_DB_USER: colegio_app
  COLEGIO_DB_PASSWORD_FILE: /run/secrets/db_app
  COLEGIO_MFA_KEY_FILE: /run/secrets/mfa_key

x-php: &php
  image: colegio-php-vps:local
  build:
    context: ../..
    args:
      PHP_VARIANT: fpm
    target: vps-php
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  volumes:
    - database_socket:/var/run/postgresql:ro
  environment: *app-environment

services:
  edge:
    image: colegio-php-edge:local
    build:
      context: ../..
      target: vps-edge
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    environment:
      COLEGIO_DOMAIN: "${COLEGIO_DOMAIN:?Configura COLEGIO_DOMAIN}"
      COLEGIO_ACME_EMAIL: "${COLEGIO_ACME_EMAIL:?Configura COLEGIO_ACME_EMAIL}"
    ports:
      - "${COLEGIO_HTTP_BIND:-0.0.0.0:80}:8080"
      - "${COLEGIO_HTTPS_BIND:-0.0.0.0:443}:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, application]
    depends_on:
      app:
        condition: service_started

  app:
    <<: *php
    restart: unless-stopped
    networks: [application]
    secrets: [db_app, mfa_key]
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    <<: *php
    network_mode: none
    secrets: [db_migrator, mfa_key]
    environment:
      <<: *app-environment
      COLEGIO_DB_USER: colegio_migrator
      COLEGIO_DB_PASSWORD_FILE: /run/secrets/db_migrator
    command: ["sh", "-c", "php bin/console.php migrate && exec php deploy/vps/database-grants.php"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *php
    restart: unless-stopped
    network_mode: none
    secrets: [db_app]
    command: ["sh", "deploy/vps/worker.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16
    restart: unless-stopped
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    security_opt: [no-new-privileges:true]
    logging: *logging
    command: ["postgres", "-c", "listen_addresses=", "-c", "unix_socket_directories=/var/run/postgresql"]
    environment:
      POSTGRES_DB: colegio_php
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    secrets: [db_owner, db_migrator, db_app]
    volumes:
      - database_data:/var/lib/postgresql/data
      - database_socket:/var/run/postgresql
      - ./database-init.sh:/docker-entrypoint-initdb.d/10-colegio.sh:ro
    healthcheck:
      # PID 1 becomes postgres only after init scripts and the temporary server exit.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -h /var/run/postgresql -U postgres -d colegio_php"]
      interval: 5s
      timeout: 3s
      retries: 24

networks:
  public:
  application:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  database_data:
  database_socket:

secrets:
  db_owner:
    file: "${COLEGIO_SECRETS_DIR:-./secrets}/db_owner"
  db_migrator:
    file: "${COLEGIO_SECRETS_DIR:-./secrets}/db_migrator"
  db_app:
    file: "${COLEGIO_SECRETS_DIR:-./secrets}/db_app"
  mfa_key:
    file: "${COLEGIO_SECRETS_DIR:-./secrets}/mfa_key"
