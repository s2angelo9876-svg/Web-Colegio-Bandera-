[global]
include = /usr/local/etc/php-fpm.conf
include = /app/deploy/vps/php-fpm.conf

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
clear_env = yes
env[COLEGIO_ENV] = $COLEGIO_ENV
env[COLEGIO_PUBLIC_ORIGIN] = $COLEGIO_PUBLIC_ORIGIN
env[COLEGIO_DSN] = $COLEGIO_DSN
env[COLEGIO_DB_USER] = $COLEGIO_DB_USER
env[COLEGIO_DB_PASSWORD] = $COLEGIO_DB_PASSWORD
env[COLEGIO_MFA_KEY] = $COLEGIO_MFA_KEY
