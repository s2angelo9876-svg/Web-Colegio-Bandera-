name: PHP editorial

on:
  pull_request:
    paths:
      - 'php/**'
      - '.github/workflows/php.yml'
  push:
    branches: [main]
    paths:
      - 'php/**'
      - '.github/workflows/php.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium para las pruebas
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verificar PHP, PostgreSQL y navegador
        env:
          COLEGIO_BROWSER_TESTS: '1'
          COLEGIO_DEV_STATE: ${{ runner.temp }}/colegio-php-tests
        run: |
          bash -n php/bin/dev
          for script in php/tests/*.sh; do bash -n "$script"; done
          node --check php/public/site.js
          php/bin/dev test
